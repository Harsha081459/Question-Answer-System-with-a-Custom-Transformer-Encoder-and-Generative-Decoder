name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Test
        run: python -m pytest -q

  checkpoint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python download_models.py
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      - run: python -m pytest tests/test_checkpoint_smoke.py -q
        env:
          RUN_QA_SMOKE: "1"
      - name: Build and launch documented Docker demo
        run: |
          docker build -t custom-qa .
          docker run -d --name qa-smoke -p 127.0.0.1:7860:7860 custom-qa
      - name: Check container inference
        run: |
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost:7860/ready
          curl --fail -H 'Content-Type: application/json' -d '{"model_type":"extractive","question":"Who created Python?","context":"Python was created by Guido van Rossum and released in 1991."}' http://localhost:7860/predict | python -c 'import json,sys; assert json.load(sys.stdin)["answer"] == "Guido van Rossum"'
      - name: Container logs
        if: failure()
        run: docker logs qa-smoke
      - name: Stop container
        if: always()
        run: docker stop qa-smoke || true
